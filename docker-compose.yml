# Local development stack. Values come from `.env` (copy `.env.example`).
# Ports are bound to 127.0.0.1 so nothing is exposed to the network.

services:
  db:
    build: ./docker/postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username $$POSTGRES_USER --dbname $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:?Set REDIS_PORT in .env}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      LOG_LEVEL: ${LOG_LEVEL:?Set LOG_LEVEL in .env}
      # Inside the Compose network the API reaches the other services by name.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:?Set EMBEDDING_DIMENSION in .env}
      META_APP_SECRET: ${META_APP_SECRET:?Set META_APP_SECRET in .env}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?Set META_WEBHOOK_VERIFY_TOKEN in .env}
      COLLECTION_HINT_WINDOW_SECONDS: ${COLLECTION_HINT_WINDOW_SECONDS:?Set COLLECTION_HINT_WINDOW_SECONDS in .env}
      INGESTION_STATE_TTL_SECONDS: ${INGESTION_STATE_TTL_SECONDS:?Set INGESTION_STATE_TTL_SECONDS in .env}
    ports:
      - "127.0.0.1:${API_PORT:?Set API_PORT in .env}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 5s
      retries: 10

  # The indexing worker (`python -m app.pipeline.worker`). It needs nearly every
  # setting (database, Redis, models, pipeline, Send API), so it reads `.env`
  # whole; the values below override the ones that differ inside Compose.
  worker:
    build: .
    command: ["python", "-m", "app.pipeline.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_DIR: /srv/savely/media
      FFMPEG_PATH: ffmpeg
      FFPROBE_PATH: ffprobe
    volumes:
      - media_data:/srv/savely/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The chat worker (`python -m app.agent.worker`): answers DMs with the response agent.
  # Like the indexing worker it reads `.env` whole. It shares the media volume, because
  # "delete my data" from a DM also erases the user's stored media.
  chat_worker:
    build: .
    command: ["python", "-m", "app.agent.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      MEDIA_STORAGE_DIR: /srv/savely/media
    volumes:
      - media_data:/srv/savely/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
